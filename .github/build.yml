name: Build Windows EXE

on:
  push:
    branches: [ main ]  # Сработает, когда ты сделаешь git push в ветку main
  workflow_dispatch:     # Позволит запустить сборку вручную кнопкой на сайте

jobs:
  build:
    runs-on: windows-latest  # GitHub запускает чистую Windows Server!

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Версия питона для сборки

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile helper.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/helper.exe  # GitHub заберёт готовый exe-шник из папки dist
